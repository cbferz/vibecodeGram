services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibecodegram}
      POSTGRES_USER: ${POSTGRES_USER:-vibecodegram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibecodegram} -d ${POSTGRES_DB:-vibecodegram}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vibecodegram}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vibecodegram}?sslmode=disable
      HTTP_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
