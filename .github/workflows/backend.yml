name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Download Go modules
        working-directory: server
        run: go mod tidy
      - name: Format Go sources
        working-directory: server
        run: gofmt -w *.go
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build API
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath ./...
