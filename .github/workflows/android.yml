name: vibecodeGram Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: vibecodegram-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-release:
    name: Build signed vibecodeGram Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install only missing Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          test -n "$SDKMANAGER"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          packages=(
            'platform-tools'
            'platforms;android-36'
            'build-tools;36.0.0'
            'cmake;3.22.1'
            'ndk;27.2.12479018'
          )
          missing=()
          for package in "${packages[@]}"; do
            case "$package" in
              platform-tools) target="$SDK_ROOT/platform-tools" ;;
              platforms\;android-36) target="$SDK_ROOT/platforms/android-36" ;;
              build-tools\;36.0.0) target="$SDK_ROOT/build-tools/36.0.0" ;;
              cmake\;3.22.1) target="$SDK_ROOT/cmake/3.22.1" ;;
              ndk\;27.2.12479018) target="$SDK_ROOT/ndk/27.2.12479018" ;;
              *) echo "Unknown SDK component: $package" >&2; exit 1 ;;
            esac
            [[ -d "$target" ]] || missing+=("$package")
          done

          if (( ${#missing[@]} > 0 )); then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "${missing[@]}"
          else
            echo "All required Android SDK components are already installed."
          fi

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          KEYSTORE="$RUNNER_TEMP/vibecodegram-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias vibecodegram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=vibecodeGram, OU=Android, O=vibecodeGram, L=Unknown, ST=Unknown, C=US"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=vibecodegram"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release APK only
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --console=plain :app:assembleRelease -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Verify signed Release APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.vibecodegram'"
          echo "Verified signed Release APK: $APK"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibecodegram-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
